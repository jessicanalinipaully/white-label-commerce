# Upstream services bound to loopback addresses
upstream commerce_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream commerce_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP Virtual Host - Serves production traffic & Certbot ACME challenges
server {
    listen 80;
    listen [::]:80;
    server_name _; # Accepts all tenant domains dynamically

    # Let's Encrypt Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy /api requests to NestJS Backend
    location /api/ {
        proxy_pass http://commerce_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # CRITICAL: Preserve tenant resolution headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy root storefront & admin requests to Next.js Frontend
    location / {
        proxy_pass http://commerce_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # CRITICAL: Preserve tenant resolution headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache_bypass $http_upgrade;
    }
}

